<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🧬 Cancer Case Insight Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9fafb;
            padding: 30px;
            max-width: 900px;
            margin: auto;
        }
        h1 {
            color: #333;
            font-size: 2rem;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #1677ff;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .results {
            margin-top: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .results h3 {
            color: #444;
            margin-top: 20px;
        }
        pre {
            white-space: pre-wrap;
            background-color: #f1f1f1;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Multi-Agent Cancer Case Analysis</h1>
    <p>Enter patient details and radiology notes to analyze the case and generate a treatment summary.</p>

    <form method="POST">
        <label>Radiologist Note</label><br>
        <textarea name="radiologist_note" rows="5" placeholder="e.g. CT shows a 3.5 cm spiculated mass in the right upper lobe..."></textarea>

        <label>Clinical Note</label><br>
        <textarea name="clinical_note" rows="5" placeholder="e.g. 60-year-old male, history of smoking, EGFR mutation..."></textarea>

        <button type="submit">🚀 Run Analysis</button>
    </form>

    {% if output %}
    <div class="results">
        {% for key, value in output.items() %}
            <h3>{{ key }}</h3>
            <pre>{{ value }}</pre>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
